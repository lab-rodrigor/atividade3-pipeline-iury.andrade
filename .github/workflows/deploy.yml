name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # O slug do usuário no servidor da disciplina
  SLUG: gr-iury-andrade
  # A primeira porta da sua faixa (23120-23129)
  PORTA: 23120

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker stop front || true"
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker rm front || true"
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker stop api || true"
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker rm api || true"
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker stop banco || true"
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker rm banco || true"

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker volume create pgdata || true"
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network create dados --interna || true"
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network create web || true"

      - name: Subir banco, API e front
        run: |
          # 1. Subir banco com volume pgdata na rede interna dados
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name banco --network dados -v pgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} -e POSTGRES_DB=pokedex postgres:17-alpine"

          # 2. Subir API na rede dados
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name api --network dados -e POSTGRES_HOST=gr-iury-andrade-banco -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} gr-atv2-api:1"

          # 3. Conectar API na rede web
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker network connect web api || true"

          # 4. Subir Front na rede web publicando a porta e enviando o DEPLOY_SHA (Item 5)
          ssh -i ~/.ssh/deploy ${{ env.SLUG }}@gr.lab.ayty.org "gr-docker run -d --name front --network web -p ${{ env.PORTA }}:80 -e API=gr-iury-andrade-api -e DEPLOY_SHA=${{ github.sha }} gr-atv2-front:1"

      - name: Conferir que subiu
        run: |
          sleep 5
          curl -f http://gr.lab.ayty.org:${{ env.PORTA }}
